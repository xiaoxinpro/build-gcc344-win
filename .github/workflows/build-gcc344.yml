name: Build MinGW GCC 3.4.4 for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

permissions:
  contents: write

env:
  TARGET: i686-pc-mingw32
  GCC_VERSION: 3.4.4
  BINUTILS_VERSION: 2.16.1
  W32API_VERSION: 3.11
  MINGW_RUNTIME_VERSION: 3.14
  RELEASE_TAG: gcc-3.4.4-mingw32

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare work directory on host
        run: |
          rm -rf "${{ github.workspace }}/work"
          mkdir -p "${{ github.workspace }}/work"
          chmod 777 "${{ github.workspace }}/work"

      - name: Build in Debian 8 container
        run: |
          set -o pipefail
          docker run --rm \
            -v "${{ github.workspace }}/work:/work" \
            -e TARGET=${{ env.TARGET }} \
            -e GCC_VERSION=${{ env.GCC_VERSION }} \
            -e BINUTILS_VERSION=${{ env.BINUTILS_VERSION }} \
            -e W32API_VERSION=${{ env.W32API_VERSION }} \
            -e MINGW_RUNTIME_VERSION=${{ env.MINGW_RUNTIME_VERSION }} \
            debian:8 \
            /bin/bash -c '
          set -e
          
          # ===== 配置 Debian 8 归档源 =====
          cat > /etc/apt/sources.list <<EOF
          deb http://archive.debian.org/debian/ jessie main
          deb http://archive.debian.org/debian-security/ jessie/updates main
          EOF
          
          mkdir -p /etc/apt/apt.conf.d
          cat > /etc/apt/apt.conf.d/99archive <<EOF
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          Acquire::AllowDowngradeToInsecureRepositories "true";
          EOF
          
          apt-get update
          apt-get install -y --allow-unauthenticated \
            build-essential wget bzip2 tar file \
            bison flex \
            texinfo libgmp-dev libmpfr-dev \
            ca-certificates
          
          # ===== 定义构建路径 =====
          CROSS_PREFIX=/work/cross
          NATIVE_PREFIX=/work/native
          export MAKEINFO=true
          mkdir -p ${CROSS_PREFIX} ${NATIVE_PREFIX}
          mkdir -p /work/src /work/build
          
          # ===== 下载并校验源码包 =====
          cd /work/src
          
          echo ">>> Downloading GCC ${GCC_VERSION}..."
          wget -nv -O gcc.tar.bz2 \
            https://ftp.gnu.org/gnu/gcc/gcc-${GCC_VERSION}/gcc-${GCC_VERSION}.tar.bz2
          bzip2 -t gcc.tar.bz2 && file gcc.tar.bz2
          
          echo ">>> Downloading binutils ${BINUTILS_VERSION}..."
          wget -nv -O binutils.tar.bz2 \
            https://ftp.gnu.org/gnu/binutils/binutils-${BINUTILS_VERSION}.tar.bz2
          bzip2 -t binutils.tar.bz2 && file binutils.tar.bz2
          
          echo ">>> Downloading w32api ${W32API_VERSION}..."
          wget -nv -O w32api.tar.gz \
            "https://sourceforge.net/projects/mingw/files/OldFiles/w32api-${W32API_VERSION}/w32api-${W32API_VERSION}.tar.gz/download"
          gzip -t w32api.tar.gz && file w32api.tar.gz
          
          echo ">>> Downloading mingw-runtime ${MINGW_RUNTIME_VERSION}..."
          wget -nv -O mingwrt.tar.gz \
            "https://sourceforge.net/projects/mingw/files/OldFiles/mingw-runtime-${MINGW_RUNTIME_VERSION}/mingw-runtime-${MINGW_RUNTIME_VERSION}.tar.gz/download"
          gzip -t mingwrt.tar.gz && file mingwrt.tar.gz
          
          # ===== 解压源码 =====
          echo ">>> Extracting sources..."
          tar xjf gcc.tar.bz2
          tar xjf binutils.tar.bz2
          mkdir -p w32api-src mingwrt-src
          tar xzf w32api.tar.gz -C w32api-src
          tar xzf mingwrt.tar.gz -C mingwrt-src

          validate_mingw_package() {
            local root="$1"
            local name="$2"
            if [ ! -d "${root}/include" ] || [ ! -d "${root}/lib" ]; then
              echo "!!! ${name} archive did not extract the expected include/ and lib/ directories" >&2
              find "${root}" -maxdepth 2 -print >&2
              return 1
            fi
          }

          install_mingw_package() {
            local src="$1"
            local prefix="$2"
            mkdir -p "${prefix}/include" "${prefix}/lib"
            cp -r "${src}/include/." "${prefix}/include/"
            cp -r "${src}/lib/." "${prefix}/lib/"
            if [ -d "${src}/bin" ]; then
              mkdir -p "${prefix}/bin"
              cp -r "${src}/bin/." "${prefix}/bin/"
            fi
          }

          W32API_SRC=/work/src/w32api-src
          MINGWRT_SRC=/work/src/mingwrt-src
          validate_mingw_package "${W32API_SRC}" "w32api"
          validate_mingw_package "${MINGWRT_SRC}" "mingw-runtime"
          echo ">>> w32api source directory: ${W32API_SRC}"
          echo ">>> mingw-runtime source directory: ${MINGWRT_SRC}"
          
          # ===== 通用编译辅助函数 =====
          run_make() {
            local logbase="$1"
            shift
            
            echo ">>> Running make with logging to ${logbase}.log..."
            if make "$@" > /work/build/${logbase}.log 2>&1; then
              echo ">>> Build succeeded"
              tail -80 /work/build/${logbase}.log
              return 0
            else
              echo "!!! Build FAILED, last 80 lines:"
              tail -80 /work/build/${logbase}.log
              echo ""
              echo "!!! Extracting error lines:"
              grep -iE "error:|undefined reference|cannot find|No rule to make target" /work/build/${logbase}.log | head -20 || true
              echo ""
              echo "!!! Retrying with -j1 for clearer error..."
              make -j1 "$@" > /work/build/${logbase}.serial.log 2>&1 || true
              tail -100 /work/build/${logbase}.serial.log
              return 1
            fi
          }
          
          # ==================== 阶段 1: 交叉 binutils (build=linux, host=linux, target=mingw32) ====================
          echo ""
          echo "=========================================="
          echo "Stage 1: Building cross binutils"
          echo "=========================================="
          cd /work/build
          mkdir -p binutils-cross && cd binutils-cross
          
          /work/src/binutils-${BINUTILS_VERSION}/configure \
            --prefix=${CROSS_PREFIX} \
            --target=${TARGET} \
            --disable-nls \
            --disable-werror \
            --disable-shared \
            --with-sysroot
          
          run_make "binutils-cross" -j$(nproc) MAKEINFO=true all
          make install MAKEINFO=true
          
          export PATH="${CROSS_PREFIX}/bin:${PATH}"
          echo ">>> Cross binutils installed:"
          ls -lh ${CROSS_PREFIX}/bin/
          
          # ==================== 阶段 2: 安装 MinGW headers & 构建交叉 GCC ====================
          echo ""
          echo "=========================================="
          echo "Stage 2: Installing MinGW headers"
          echo "=========================================="
          
          mkdir -p ${CROSS_PREFIX}/${TARGET}/include
          mkdir -p ${CROSS_PREFIX}/${TARGET}/lib
          
          # 这些旧 MinGW 包是预打包的 headers/import libs，不包含可构建源码树。
          install_mingw_package "${W32API_SRC}" "${CROSS_PREFIX}/${TARGET}"
          install_mingw_package "${MINGWRT_SRC}" "${CROSS_PREFIX}/${TARGET}"
          
          echo ">>> Headers installed:"
          ls ${CROSS_PREFIX}/${TARGET}/include/ | head -20
          
          # ==================== 阶段 3: 交叉 GCC (bootstrap, all-gcc + all-target-libgcc) ====================
          echo ""
          echo "=========================================="
          echo "Stage 3: Building cross GCC (bootstrap)"
          echo "=========================================="
          cd /work/build
          mkdir -p gcc-cross && cd gcc-cross
          
          /work/src/gcc-${GCC_VERSION}/configure \
            --prefix=${CROSS_PREFIX} \
            --target=${TARGET} \
            --enable-languages=c,c++ \
            --with-headers=${CROSS_PREFIX}/${TARGET}/include \
            --disable-nls \
            --disable-shared \
            --disable-threads \
            --disable-win32-registry \
            --disable-werror \
            --with-gnu-as \
            --with-gnu-ld \
            --without-x
          
          run_make "gcc-cross-all-gcc" -j$(nproc) MAKEINFO=true all-gcc
          make install-gcc MAKEINFO=true
          
          # w32api/mingw-runtime 的 headers 和库已在 Stage 2 从归档包安装。
          echo ">>> Libraries installed:"
          ls -lh ${CROSS_PREFIX}/${TARGET}/lib/ | head -20
          
          # 完成 libgcc
          cd /work/build/gcc-cross
          run_make "gcc-cross-libgcc" -j$(nproc) MAKEINFO=true all-target-libgcc
          make install-target-libgcc MAKEINFO=true
          
          echo ">>> Cross GCC ready:"
          ${CROSS_PREFIX}/bin/${TARGET}-gcc --version
          
          # ==================== 阶段 4: Canadian Cross - Native binutils (build=linux, host=mingw32, target=mingw32) ====================
          echo ""
          echo "=========================================="
          echo "Stage 4: Building native Windows binutils"
          echo "=========================================="
          cd /work/build
          mkdir -p binutils-native && cd binutils-native
          
          BUILD_SYSTEM=$(/work/src/binutils-${BINUTILS_VERSION}/config.guess)
          
          /work/src/binutils-${BINUTILS_VERSION}/configure \
            --build=${BUILD_SYSTEM} \
            --host=${TARGET} \
            --target=${TARGET} \
            --prefix=${NATIVE_PREFIX} \
            --disable-nls \
            --disable-werror \
            --disable-shared
          
          run_make "binutils-native" -j$(nproc) MAKEINFO=true all
          make install MAKEINFO=true
          
          echo ">>> Native binutils built:"
          file ${NATIVE_PREFIX}/bin/*.exe | head -5
          
          # ==================== 阶段 5: Canadian Cross - Native GCC (build=linux, host=mingw32, target=mingw32) ====================
          echo ""
          echo "=========================================="
          echo "Stage 5: Building native Windows GCC"
          echo "=========================================="
          cd /work/build
          mkdir -p gcc-native && cd gcc-native
          
          /work/src/gcc-${GCC_VERSION}/configure \
            --build=${BUILD_SYSTEM} \
            --host=${TARGET} \
            --target=${TARGET} \
            --prefix=${NATIVE_PREFIX} \
            --enable-languages=c,c++ \
            --with-headers=${CROSS_PREFIX}/${TARGET}/include \
            --disable-nls \
            --disable-shared \
            --disable-threads \
            --disable-win32-registry \
            --disable-werror \
            --with-gnu-as \
            --with-gnu-ld \
            --without-x
          
          run_make "gcc-native" -j$(nproc) MAKEINFO=true all
          make install MAKEINFO=true
          
          echo ">>> Native GCC built:"
          file ${NATIVE_PREFIX}/bin/gcc.exe
          
          # ==================== 阶段 6: 复制运行时到最终包 ====================
          echo ""
          echo "=========================================="
          echo "Stage 6: Copying runtime files"
          echo "=========================================="
          
          mkdir -p ${NATIVE_PREFIX}/${TARGET}
          cp -r ${CROSS_PREFIX}/${TARGET}/include ${NATIVE_PREFIX}/${TARGET}/
          cp -r ${CROSS_PREFIX}/${TARGET}/lib ${NATIVE_PREFIX}/${TARGET}/
          if [ -d ${CROSS_PREFIX}/${TARGET}/bin ]; then
            mkdir -p ${NATIVE_PREFIX}/bin
            cp -r ${CROSS_PREFIX}/${TARGET}/bin/. ${NATIVE_PREFIX}/bin/
          fi
          
          echo ">>> Final package structure:"
          ls -lh ${NATIVE_PREFIX}/
          
          # ==================== 打包 ====================
          cd /work
          tar -cJf gcc-${GCC_VERSION}-${TARGET}-native-windows.tar.xz native/
          
          ls -lh gcc-*.tar.xz
          echo ">>> Build completed successfully!"
          ' 2>&1 | tee "${{ github.workspace }}/work/actions.log"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ github.workspace }}/work/actions.log
            ${{ github.workspace }}/work/build/*.log
          retention-days: 7

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: gcc-${{ env.GCC_VERSION }}-${{ env.TARGET }}-native-windows
          path: ${{ github.workspace }}/work/gcc-*.tar.xz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: GCC ${{ env.GCC_VERSION }} for Windows (MinGW32)
          body: |
            Native Windows build of GCC ${{ env.GCC_VERSION }} (i686-pc-mingw32)
            
            **Components:**
            - GCC: ${{ env.GCC_VERSION }}
            - Binutils: ${{ env.BINUTILS_VERSION }}
            - w32api: ${{ env.W32API_VERSION }}
            - mingw-runtime: ${{ env.MINGW_RUNTIME_VERSION }}
            
            **Installation:**
            1. Extract to C:\mingw (or any path without spaces)
            2. Add C:\mingw\native\bin to PATH
            3. Test: `gcc --version`
            
            Built via Canadian Cross (Linux → Windows host → Windows target)
          files: ${{ github.workspace }}/work/gcc-*.tar.xz
          draft: false
          prerelease: false
