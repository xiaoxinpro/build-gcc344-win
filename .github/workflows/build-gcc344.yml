name: Build GCC 3.4.4 MinGW

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: write

env:
  TARGET: i686-pc-mingw32
  GCC_VERSION: 3.4.4
  BINUTILS_VERSION: 2.16.1
  W32API_VERSION: 3.11
  MINGW_RUNTIME_VERSION: 3.14
  RELEASE_TAG: gcc-3.4.4-mingw32

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          rm -rf work dist
          mkdir -p work dist

      - name: Build native Windows GCC in Debian 8
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/work:/work" \
            -v "${{ github.workspace }}/dist:/dist" \
            -e TARGET="${TARGET}" \
            -e GCC_VERSION="${GCC_VERSION}" \
            -e BINUTILS_VERSION="${BINUTILS_VERSION}" \
            -e W32API_VERSION="${W32API_VERSION}" \
            -e MINGW_RUNTIME_VERSION="${MINGW_RUNTIME_VERSION}" \
            debian:8 \
            /bin/bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              cat > /etc/apt/sources.list <<EOF
          deb http://archive.debian.org/debian/ jessie main
          deb http://archive.debian.org/debian-security/ jessie/updates main
          EOF

              printf "Acquire::Check-Valid-Until \"false\";\nAcquire::AllowInsecureRepositories \"true\";\nAcquire::AllowDowngradeToInsecureRepositories \"true\";\n" > /etc/apt/apt.conf.d/99archive

              apt-get update
              apt-get install -y --no-install-recommends --allow-unauthenticated \
                ca-certificates curl bzip2 gzip tar xz-utils make gcc g++ libc6-dev patch file

              export PREFIX=/work/cross
              export NATIVE_PREFIX=/work/native
              export SRC=/work/src
              export BUILD=/work/build
              export PATH="${PREFIX}/bin:${PATH}"
              mkdir -p "${SRC}" "${BUILD}" "${PREFIX}" "${NATIVE_PREFIX}"

              # ---- 关键：不再用 tail 截断，改为全量日志 + 失败时抓 error ----
              run_make() {
                logfile="$1"; shift
                echo ">>> make $* (log: ${logfile})"
                if make "$@" > "${logfile}" 2>&1; then
                  echo ">>> make $* OK"
                else
                  rc=$?
                  echo "======================================================"
                  echo "make FAILED (rc=${rc}). Real error lines below:"
                  echo "======================================================"
                  # 抓真正的错误，带上下文；GNU grep 支持 -B/-A
                  grep -n -E "error:|Error|\*\*\*|undefined reference|No such file|cannot find|fatal" "${logfile}" | tail -60 || true
                  echo "------------------ tail of full log ------------------"
                  tail -80 "${logfile}"
                  echo "======================================================"
                  return "${rc}"
                fi
              }

              download() {
                url="$1"; out="$2"
                echo "Downloading ${url} -> ${out}"
                curl -L --fail --retry 5 --retry-delay 5 -o "${out}" "${url}"
                case "${out}" in
                  *.tar.gz|*.tgz) gzip -t "${out}" ;;
                  *.tar.bz2|*.tbz2) bzip2 -t "${out}" ;;
                  *) echo "unknown archive: ${out}" >&2; exit 1 ;;
                esac
                if file "${out}" | grep -qiE "HTML|text"; then
                  echo "ERROR: downloaded HTML instead of archive" >&2
                  file "${out}" >&2; exit 1
                fi
              }

              cd "${SRC}"
              download "https://ftp.gnu.org/gnu/binutils/binutils-${BINUTILS_VERSION}.tar.bz2" "binutils-${BINUTILS_VERSION}.tar.bz2"
              download "https://ftp.gnu.org/gnu/gcc/gcc-${GCC_VERSION}/gcc-${GCC_VERSION}.tar.bz2" "gcc-${GCC_VERSION}.tar.bz2"
              download "https://sourceforge.net/projects/mingw/files/OldFiles/w32api-${W32API_VERSION}/w32api-${W32API_VERSION}.tar.gz/download" "w32api-${W32API_VERSION}.tar.gz"
              download "https://sourceforge.net/projects/mingw/files/OldFiles/mingw-runtime-${MINGW_RUNTIME_VERSION}/mingw-runtime-${MINGW_RUNTIME_VERSION}.tar.gz/download" "mingw-runtime-${MINGW_RUNTIME_VERSION}.tar.gz"

              tar -xjf "binutils-${BINUTILS_VERSION}.tar.bz2"
              tar -xjf "gcc-${GCC_VERSION}.tar.bz2"

              mkdir -p "${PREFIX}/${TARGET}"
              tar -xzf "w32api-${W32API_VERSION}.tar.gz" -C "${PREFIX}/${TARGET}"
              tar -xzf "mingw-runtime-${MINGW_RUNTIME_VERSION}.tar.gz" -C "${PREFIX}/${TARGET}"
              ln -sfn "${TARGET}" "${PREFIX}/mingw"

              echo "=== Building cross binutils ==="
              mkdir -p "${BUILD}/binutils-cross"
              cd "${BUILD}/binutils-cross"
              "${SRC}/binutils-${BINUTILS_VERSION}/configure" \
                --prefix="${PREFIX}" --target="${TARGET}" \
                --disable-nls --disable-werror
              # 并行编译；若失败，用串行重跑以便定位精确错误
              if ! run_make "${BUILD}/binutils-cross.log" -j"$(nproc)"; then
                echo "### Parallel build failed. Re-running SERIAL to pinpoint the error ###"
                run_make "${BUILD}/binutils-cross.serial.log" -j1
              fi
              make install
              ls -lh "${PREFIX}/bin/" || true

              echo "=== Building cross GCC ==="
              mkdir -p "${BUILD}/gcc-cross"
              cd "${BUILD}/gcc-cross"
              "${SRC}/gcc-${GCC_VERSION}/configure" \
                --prefix="${PREFIX}" --target="${TARGET}" \
                --enable-languages=c,c++ \
                --disable-nls --disable-shared --disable-threads \
                --disable-win32-registry \
                --with-headers="${PREFIX}/${TARGET}/include" \
                --with-gnu-as --with-gnu-ld --without-x

              if ! run_make "${BUILD}/gcc-cross.log" -j"$(nproc)" all-gcc; then
                run_make "${BUILD}/gcc-cross.serial.log" -j1 all-gcc
              fi
              make install-gcc

              if ! run_make "${BUILD}/libgcc-cross.log" -j"$(nproc)" all-target-libgcc; then
                run_make "${BUILD}/libgcc-cross.serial.log" -j1 all-target-libgcc
              fi
              make install-target-libgcc

              echo "=== Cross toolchain verification ==="
              "${TARGET}-gcc" --version
              "${TARGET}-g++" --version

              echo "=== Building native binutils (Canadian Cross) ==="
              mkdir -p "${BUILD}/binutils-native"
              cd "${BUILD}/binutils-native"
              CC="${TARGET}-gcc" AR="${TARGET}-ar" RANLIB="${TARGET}-ranlib" \
              "${SRC}/binutils-${BINUTILS_VERSION}/configure" \
                --prefix="${NATIVE_PREFIX}" \
                --build="$(gcc -dumpmachine)" --host="${TARGET}" --target="${TARGET}" \
                --disable-nls --disable-werror
              if ! run_make "${BUILD}/binutils-native.log" -j"$(nproc)"; then
                run_make "${BUILD}/binutils-native.serial.log" -j1
              fi
              make install

              echo "=== Building native GCC (Canadian Cross) ==="
              mkdir -p "${BUILD}/gcc-native"
              cd "${BUILD}/gcc-native"
              export CC_FOR_BUILD=gcc
              export CC="${TARGET}-gcc" CXX="${TARGET}-g++"
              export AR="${TARGET}-ar" RANLIB="${TARGET}-ranlib"
              export AS="${TARGET}-as" LD="${TARGET}-ld"
              "${SRC}/gcc-${GCC_VERSION}/configure" \
                --prefix="${NATIVE_PREFIX}" \
                --build="$(gcc -dumpmachine)" --host="${TARGET}" --target="${TARGET}" \
                --enable-languages=c,c++ \
                --disable-nls --disable-shared --disable-threads \
                --disable-win32-registry --with-gnu-as --with-gnu-ld --without-x
              if ! run_make "${BUILD}/gcc-native.log" -j"$(nproc)" all-gcc; then
                run_make "${BUILD}/gcc-native.serial.log" -j1 all-gcc
              fi
              make install-gcc
              if ! run_make "${BUILD}/libgcc-native.log" -j"$(nproc)" all-target-libgcc; then
                run_make "${BUILD}/libgcc-native.serial.log" -j1 all-target-libgcc
              fi
              make install-target-libgcc

              mkdir -p "${NATIVE_PREFIX}/${TARGET}"
              cp -a "${PREFIX}/${TARGET}/include" "${NATIVE_PREFIX}/${TARGET}/"
              cp -a "${PREFIX}/${TARGET}/lib" "${NATIVE_PREFIX}/${TARGET}/"

              cd /work
              tar -cJf "/dist/gcc-${GCC_VERSION}-${TARGET}-native-windows.tar.xz" -C "${NATIVE_PREFIX}" .

              echo "=== Verification ==="
              ls -lh "${NATIVE_PREFIX}/bin/"
              file "${NATIVE_PREFIX}/bin/gcc.exe"
              test -f "${NATIVE_PREFIX}/bin/gcc.exe"
              test -f "${NATIVE_PREFIX}/bin/g++.exe"
            '

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: work/build/*.log
          if-no-files-found: warn

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcc-3.4.4-i686-pc-mingw32-native-windows
          path: dist/*.tar.xz
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: GCC 3.4.4 MinGW native Windows
          body: |
            Native Windows GCC 3.4.4 for i686-pc-mingw32 (Canadian Cross on Debian 8).
            Components: GCC 3.4.4 / binutils 2.16.1 / w32api 3.11 / mingw-runtime 3.14
          files: dist/*.tar.xz
